name: Windows
# Workflow file for windows
on:
  push:
    branches: [master, Sandbox]
  pull_request:
    branches: [master, Sandbox]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        os: [windows-2022]
        buildconfig: [debug, release]
        include:
          - os: windows-2022
            shell: cmd
            compiler: cl
            target: Windows

    steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup DotNet
      uses: actions/setup-dotnet@v4
      with:
        # Sharpmake needs .NET 6 or later
        dotnet-version: "8.0.x"
        
    - name: Checkout
      uses: actions/checkout@v4
          
    - name: Generate a new project
      shell: cmd
      run: cd RZE/ && call GenerateSolutions.bat
      
    - name: Compile Project
      shell: cmd
      run: msbuild -m RZE/RZE.sln /property:Configuration="${{matrix.buildconfig}}"
      
    - name: Run Unit Tests
      shell: cmd
      run: call .\RZE\_build\${{matrix.buildconfig}}\UnitTests.exe
      continue-on-error: false

    - name: Burn Assets
      shell: cmd
      run: call .\RZE\_build\${{matrix.buildconfig}}\SourceAssetBurner.exe
      continue-on-error: false

    # The executables read their data from the source tree (the folder above _build), so the archive keeps that layout
    - name: Archive Build
      uses: actions/upload-artifact@v4
      with:
        name: RZE v${{github.run_number}} - ${{matrix.buildconfig}}
        path: |
          RZE/_build/${{matrix.buildconfig}}
          RZE/Assets
          RZE/Config
          RZE/ProjectData
          !RZE/_build/${{matrix.buildconfig}}/*.lib
          !RZE/_build/${{matrix.buildconfig}}/*.pdb
          !RZE/_build/${{matrix.buildconfig}}/*.exp
          !RZE/_build/${{matrix.buildconfig}}/*.log
