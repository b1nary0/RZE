name: Windows
# Workflow file for Windows: Visual Studio 2026 (v145) and the Windows SDK 10.0.26100, which RZE.sharpmake.cs targets
on:
  # Every branch whose workflow file has this trigger (GitHub reads the file from the pushed commit)
  push:
    paths-ignore: ['Docs/**', '**/*.md', '.claude/**']
  pull_request:
    branches: [master, Sandbox]
    paths-ignore: ['Docs/**', '**/*.md', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Named explicitly, so a change of windows-latest can't move the toolchain
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        buildconfig: [debug, release, retail]

    steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    # Sharpmake needs .NET 8 or later. Pinned rather than relying on the image's SDKs, which drop .NET 8 after its
    # end of support
    - name: Setup DotNet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: "8.0.x"

    - name: Checkout
      uses: actions/checkout@v7

    - name: Generate a new project
      shell: cmd
      run: cd RZE && call GenerateSolutions.bat

    - name: Compile Project
      shell: cmd
      run: msbuild -m RZE/RZE.sln /p:Configuration=${{matrix.buildconfig}} /p:Platform=x64 /nologo

    - name: Run Unit Tests
      shell: cmd
      run: .\RZE\_build\${{matrix.buildconfig}}\UnitTests.exe

    - name: Burn Assets
      shell: cmd
      run: .\RZE\_build\${{matrix.buildconfig}}\SourceAssetBurner.exe

    # The Editor on DrawLineTest.scene. The runner has no GPU: DX11 runs on the Microsoft Basic Render Driver (WARP)
    - name: Editor smoke test
      shell: cmd
      run: python .github\scripts\editor_smoke.py --config ${{matrix.buildconfig}} --out smoke-out

    - name: Archive smoke test
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Editor smoke test v${{github.run_number}} - Windows - ${{matrix.buildconfig}}
        retention-days: 14
        if-no-files-found: ignore
        path: smoke-out

    # Only builds of the main branches are kept. The executables read their data from the source tree (the folder
    # above _build), so the archive keeps that layout
    - name: Archive Build
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/look-what-claude-can-do'
      uses: actions/upload-artifact@v7
      with:
        name: RZE v${{github.run_number}} - Windows - ${{matrix.buildconfig}}
        retention-days: 14
        path: |
          RZE/_build/${{matrix.buildconfig}}
          RZE/Assets
          RZE/Config
          RZE/ProjectData
          !RZE/_build/${{matrix.buildconfig}}/*.lib
          !RZE/_build/${{matrix.buildconfig}}/*.pdb
          !RZE/_build/${{matrix.buildconfig}}/*.exp
          !RZE/_build/${{matrix.buildconfig}}/*.log
