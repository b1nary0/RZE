name: Linux
# Workflow file for Linux: Fedora, which packages everything RZE needs (Ubuntu's runners have no SDL3 packages)
on:
  # Every branch whose workflow file has this trigger (GitHub reads the file from the pushed commit)
  push:
    paths-ignore: ['Docs/**', '**/*.md', '.claude/**']
  pull_request:
    branches: [master, Sandbox]
    paths-ignore: ['Docs/**', '**/*.md', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        buildconfig: [debug, release, retail]

    steps:
    # The README's Linux setup, with git for the checkout
    - name: Install packages
      run: dnf install -y --setopt=install_weak_deps=False clang lld make dotnet-sdk-8.0 SDL3-devel libshaderc-devel assimp-devel git-core

    - name: Checkout
      uses: actions/checkout@v7

    - name: Generate a new project
      run: cd RZE && ./GenerateSolutions.sh

    - name: Compile Project
      run: cd RZE && make config=${{matrix.buildconfig}} -j"$(nproc)"

    - name: Run Unit Tests
      run: ./RZE/_build/${{matrix.buildconfig}}/UnitTests

    - name: Burn Assets
      run: ./RZE/_build/${{matrix.buildconfig}}/SourceAssetBurner

    # Only builds of the main branches are kept. The executables read their data from the source tree (the folder
    # above _build), so the archive keeps that layout
    - name: Archive Build
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/look-what-claude-can-do'
      uses: actions/upload-artifact@v7
      with:
        name: RZE v${{github.run_number}} - Linux - ${{matrix.buildconfig}}
        retention-days: 14
        path: |
          RZE/_build/${{matrix.buildconfig}}
          RZE/Assets
          RZE/Config
          RZE/ProjectData
          !RZE/_build/${{matrix.buildconfig}}/*.a
          !RZE/_build/${{matrix.buildconfig}}/*.log
