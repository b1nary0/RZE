name: Linux
# Workflow file for Linux: Fedora, which packages everything RZE needs (Ubuntu's runners have no SDL3 packages)
on:
  # Every branch whose workflow file has this trigger (GitHub reads the file from the pushed commit)
  push:
    paths-ignore: ['Docs/**', '**/*.md', '.claude/**']
  pull_request:
    branches: [master, Sandbox]
    paths-ignore: ['Docs/**', '**/*.md', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        buildconfig: [debug, release, retail]

    steps:
    # The README's Linux setup, with git for the checkout, and a display with software OpenGL (Mesa's llvmpipe) for
    # the Editor smoke test
    - name: Install packages
      run: >-
        dnf install -y --setopt=install_weak_deps=False clang lld make dotnet-sdk-8.0 SDL3-devel libshaderc-devel
        assimp-devel git-core xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers python3

    - name: Checkout
      uses: actions/checkout@v7

    - name: Generate a new project
      run: cd RZE && ./GenerateSolutions.sh

    - name: Compile Project
      run: cd RZE && make config=${{matrix.buildconfig}} -j"$(nproc)"

    - name: Run Unit Tests
      run: ./RZE/_build/${{matrix.buildconfig}}/UnitTests

    - name: Burn Assets
      run: ./RZE/_build/${{matrix.buildconfig}}/SourceAssetBurner

    # The Editor on Sponza.scene, rendered in software on a virtual display
    - name: Editor smoke test
      env:
        SDL_VIDEO_DRIVER: x11
      run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 .github/scripts/editor_smoke.py --config ${{matrix.buildconfig}} --out smoke-out

    - name: Archive smoke test
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Editor smoke test v${{github.run_number}} - Linux - ${{matrix.buildconfig}}
        retention-days: 14
        if-no-files-found: ignore
        path: smoke-out

    # Only builds of the main branches are kept. The executables read their data from the source tree (the folder
    # above _build), so the archive keeps that layout
    - name: Archive Build
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/look-what-claude-can-do'
      uses: actions/upload-artifact@v7
      with:
        name: RZE v${{github.run_number}} - Linux - ${{matrix.buildconfig}}
        retention-days: 14
        path: |
          RZE/_build/${{matrix.buildconfig}}
          RZE/Assets
          RZE/Config
          RZE/ProjectData
          !RZE/_build/${{matrix.buildconfig}}/*.a
          !RZE/_build/${{matrix.buildconfig}}/*.log
