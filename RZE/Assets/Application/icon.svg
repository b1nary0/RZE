<!-- The source of RZE.ico, the executables' icon: Assets/Editor/logo.svg's hexagon and gizmo, without the letters or the divider.
     RZE.ico holds 16, 20, 24, 32, 40, 48, 64 and 256 px frames, each drawn at 8x with Pillow from these shapes and
     downscaled with Lanczos (premultiplied). Frames under 256 px are 32-bit BMPs, the 256 px one is a PNG. The 16-24 px
     frames are a heavier variant so the lines survive the downscale: outline 34, shafts 50, arrowheads 1.3x about their
     base with a 14 stroke, the hexagon pulled in by 6 to fit, and no centre dot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 42 448 448" width="256" height="256">
<polygon points="256.0,52.0 441.3,159.0 441.3,373.0 256.0,480.0 70.7,373.0 70.7,159.0" fill="#1c2129" stroke="#5d6b80" stroke-width="20" stroke-linejoin="round"/>
<line x1="256" y1="266" x2="256.0" y2="160.0" stroke="#53d36f" stroke-width="30" stroke-linecap="round"/>
<polygon points="256.0,98.0 290.0,160.0 222.0,160.0" fill="#53d36f" stroke="#53d36f" stroke-width="8" stroke-linejoin="round"/>
<line x1="256" y1="266" x2="347.8" y2="319.0" stroke="#f0505a" stroke-width="30" stroke-linecap="round"/>
<polygon points="401.5,350.0 330.8,348.4 364.8,289.6" fill="#f0505a" stroke="#f0505a" stroke-width="8" stroke-linejoin="round"/>
<line x1="256" y1="266" x2="164.2" y2="319.0" stroke="#4796ff" stroke-width="30" stroke-linecap="round"/>
<polygon points="110.5,350.0 147.2,289.6 181.2,348.4" fill="#4796ff" stroke="#4796ff" stroke-width="8" stroke-linejoin="round"/>
<circle cx="256" cy="266" r="30" fill="#f2f5fa"/>
</svg>
